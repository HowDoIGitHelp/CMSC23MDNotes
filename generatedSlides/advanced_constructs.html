## Recursive Definitions

``` prolog
is_ancestor(Parent, Child) :- is_parent(Parent, Child).
is_ancestor(Ancestor, Descendant) :-
    is_parent(Parent, Descendant), 
    is_ancestor(Ancestor, Parent).

is_parent(juan, francisco).
```

is_parent(lorenzo, teodora).
```

\begin{aligned}
&a + 0 = a\\

## Numbers in Logic Programming

\end{aligned}
$$`

## Numbers in Logic Programming

- The library `clp(fd)` stands for **Constraint Logic Programming Over
  Finite Domains**.
- This library was further refined to a more complete and more advanced
  library called `clp(z)` or **Constrained Programming Over Integers**.

---

## Numbers in Logic Programming

- **Constraints** are predicates that restrict a variable to a specific
  set of values.
- Constraints are usually applied to *numerical variables* to define the
  domain of said variable.

---

## Numbers in Logic Programming

- `X #= Y`: $x = y$
- `X #< Y`: $x < y$
- `X #> Y`: $x > y$
- `X #\= Y`: $x \neq y$
- `X #>= Y`: $x \geq y$
- `X #=< Y`: $x \leq y$

## Lists

- An **empty list** is represented by the special atom `[]`.
- Any term defined as `list(Head, Tail)` is a *list*, if `Tail` is a
  *list*.

---

## Lists

- With this you can represent a list with *one element* as
  `list(elem1, [])`.
- You can define a list with *two elements* as
  `list(elem1, list(elem2, []))`.

---

## Lists

- For example, a *list with four elements* can be written as
  `[elem1, elem2, elem3, elem4]`.
- Prolog still allows us to use the *head-tail* pattern for defining
  lists as `[Head|Tail]`.
- Such a list is valid if `Tail` is also a *valid list*.

---

## Lists

``` prolog
?- =([elem1, elem2, elem3, elem4], [elem1 | [elem2, elem3, elem4]]).
true.
```

---

## Lists

``` prolog
?- =([elem1, elem2, elem3, elem4], [elem1, elem2 | [elem3, elem4]]).
true.
```

---

## Lists

``` prolog
:- use_module(library(clpfd)).

list_length([], 0).
list_length([Head|Tail], Length) :-
    Length #= Tail_length + 1,
    list_length(Tail, Tail_length).
```

---

## Lists

``` prolog
?- list_length([a,b,c,d],X).
X = 4.
```

## Lists
