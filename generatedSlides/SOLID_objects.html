# SOLID Objects

---
class: center, middle

# Introduction

---

# Learning Outcomes

1.  Design methods and classes with exactly one responsibility
2.  Design extension to classes to incorporate new behavior
3.  Design proper realization and specialization relationships
4.  Design purposeful abstractions and abstract methods
5.  Design systems that interact through abstractions

---

# Learning Outcomes

- **Single Responsibility Principle** - Objects should have cohesive and
  complete responsibilities. It shouldn't be aware of knowledge it
  doesn't need, and it shouldn't perform responsibilities that are
  irrelevant from it.
- **Open/Closed Principle** - Classes should be open to extension and
  closed to modification. Instead of changing the form and behavior of
  an existing class, you should extend the class
- **Liskov-Substitution Principle** - Substituting objects by their
  subtypes/realizations should always work.

---

# Learning Outcomes

- **Interface Segregation Principle** - A client shouldn't be forced to
  implement methods that it doesn't use
- **Dependency Inversion Principle** - Object relationships should
  depend on abstractions instead of implementations

# The GOD Class

- One of the canonical examples of violations against SRP is the concept
  known as the **god class**.

---

# The GOD Class

![God class library card](../mdNotes/uml/godclasslibrarycard.png)

---

# The GOD Class

- On the example above `LibraryCard` is a god class since it exposes the
  secrets of `Date` by forcing the creations of *evil* getters
  (`getMonth()`, `getDay()`, `getYear()`) for otherwise private details.

---

# Assigning the correct responsibilities

- When you're introducing new behavior or information to a system, you
  should ask first: *who should be responsible for this behavior or
  information?*

---

# Assigning the correct responsibilities

- Who should be responsible for calculating the differences between
  dates? **`Date` should be responsible, not `LibraryCard`**.
- Who should be responsible for calculating the penalties of specific
  `BorrowableItem` realizations? **`BorrowableItem` realizations should
  be responsible, not `LibraryCard`**

---

# Assigning the correct responsibilities

- `LibraryCard` should not be aware of **how** dates are subtracted to
  be able to subtract dates.

---

# Open/Closed Principle

- This is **opening `Bank` up for modification**.

---

# Open/Closed Principle

![open for extension](../mdNotes/uml/openforextension.png)

---

# Open/Closed Principle

- Inside `CreditAccount.applyMonthlyChange()` you just call
  `applyMonthlyInterest()`,
- Inside `DebitAccount.applyMonthlyChange()` you call both
  `applyMontlyInterest()` and `deactivateIfUnderBalanced()`
- Inside `PayrollAccount.applyMonthlyChange()` you do nothing

---

# Open/Closed Principle

> The previous library card example and bank examples are indeed
> similar. This is because introspective checks like `isinstance` are
> again symptoms of inelegant design.

---

# Open/Closed Principle

> Closed for modification does not mean you cannot change literally
> anything in the class. Of course if there are mistakes in the specific
> behavior of the class then you have to modify it.
