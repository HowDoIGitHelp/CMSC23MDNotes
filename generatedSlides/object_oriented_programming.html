## The Surface and the Volume

---

## Data Hiding and the Interface

- The base premise of OOP is the concept called **data hiding**.

---

## Data Hiding and the Interface

- Some of the data in `Book` should be **hidden** from a client object
  `LibraryCard`.

---

## Data Hiding and the Interface

- The process of modeling elegant object representations is basically
  determining what the **public interface** of that object may be.

---

## Data Hiding and the Interface

![Class diagram of a book class](../mdNotes/uml/public_interface.svg)

---

## Data Hiding and the Interface

item](../mdNotes/copyright_free_drawings/abstractionborrowableitems.png)

---

## Abstraction of Objects

- Creating interfaces like these provide OOP with the mechanism to
  create **abstractions** in the object level.

---

## Abstraction of Objects

- In the example above, the interface `BorrowableItem` is an abstract
  representation of *something from the library that can be borrowed*.

---

## Abstraction of Objects

- The reason why this structure still works, is because we have a
  concrete class called `Book` which is a **realization** or an
  **implementation** of `BorrowableItem`.
- A book is *something from the library that can be borrowed*.

---

## Abstraction of Objects

- If *something from the library that can be borrowed* is an abstract
  idea, what is the point of modelling its representation?

---

## Abstraction of Objects

- Since a periodical is also *something from the library that can be
  borrowed*, a periodical is another **realization** of
  `BorrowableItem`.

---

## Abstraction of Objects

![Class diagram of a book
class](../mdNotes/uml/public_interface_2_realizations.svg)

---

## The Interface and the Implementation

- A library card name shouldn't mix with a book title, so we put a
  boundary between them by **encapsulating** them into their respective
  objects.

---

## The Interface and the Implementation

- The volume of these blobs represent the **implementation** of these
  objects and the surface of these blobs represent the **interface** of
  these objects.
