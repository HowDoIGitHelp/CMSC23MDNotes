## History of Design Patterns

- The concept of design patterns is often attributed to Christopher
  Alexander, from his book, *A Pattern Language: Towns, Buildings,
  Construction* [@alexander_pattern_2017].

---

## History of Design Patterns

- Four software engineers, Erich Gamma, John Vlissides, Ralph Johnson,
  and Richard Helm, used this as an inspiration to publish the famous
  book, *Design Patterns: Elements of Reusable Object-Oriented
  Software.* [@gamma_design_2011] The four became collectively known as
  the "**Gang of Four"**.

---

## Classifications of Design Patterns

- **Creational Patterns** provide object creation mechanisms that
  increase flexibility and reuse of existing code
- **Structural patterns** explain how to assemble objects and classes
  into larger structures, while keeping the structures flexible and
  efficient.

---

## Classifications of Design Patterns

- **Behavioral patterns** take care of effective communication and the
  assignment of responsibilities between objects.
