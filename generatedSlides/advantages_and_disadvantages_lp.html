## Advantages and Disadvantages of Logic Programming

---

## Advantages

- Functional programming has lambda calculus and logic programming is
  based on *first-order predicate calculus*.

---

## Advantages

- Being non-imperative also gives them an edge of automatically being
  *immune to the perils of state* and at the same time being *prone to
  the perils of its absence*.

---

## Advantages

- Beyond the general advantages of declarative programming, Logic
  programming can be a powerful solver in problems like **automated
  theorem proving**, **constraint related search problems**, **domain
  specific expert systems** and more.

---

## Advantages

- Logic programs also use predicates as *pure relations*.

---

## Disadvantages

- Most of the distributions Prolog are admittedly meant for a *limited*
  use cases only.

---

## Disadvantages

- Logic programming's disadvantages are also similar to functional
  programming, but can be much *worse*.
- The obvious *inefficiency* due to the absence of state is much more
  evident in logic programming because of the thorough approach of
  backtracking in SLD resolution.

---

## Disadvantages

- The *strangeness* of the paradigm itself as compared to the imperative
  way of thinking is also felt more in imperative programming.
- To get used to writing logic programs, you have to get used thinking
  in terms of *relations* and *declarative definitions*.
