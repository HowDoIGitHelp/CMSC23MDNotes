## Unification and SLD Resolution

---

## Unification

1.  Constants. These can either be atoms (known to us as strings such as
    `squirtle`) or numbers (such as `24`).
2.  Variables. Those that start with an underscore or any uppercase
    letter such as `X`, `Z3`,`_4310`, and `List`.

---

## Unification

3.  Complex terms. These have the form: `functor(term_1,...,term_n)`.
    We've seen examples of these in predicates and queries such as
    `firetype(charmander)` and `isresistantto(X,Y)`

---

## Unification

- The way Prolog is able to respond to interesting queries involving
  constants, variables and complex terms is through the **unification**.
- Through unification, prolog can identify which pairs of terms can be
  **resolved** away using resolution.

---

## Unification

- Unification algorithmically identifies **logically consistent
  substitutions** involving constants, variables, and complex terms.
- If a pair of terms unify, it means that the *negation of one of them
  produces a contradicting pair*.

---

## Unification

> Two terms unify if they are the same term or if they contain variables
> that can be uniformly instantiated with terms in such a way that the
> resulting terms are equal.

---

## Unification

`$$
\begin{aligned}
\text{Let } x = \text{ squirtle}\\
\text{isresistantto}(\text{squirtle}, \text{charmander})\\
\text{isresistantto}(\text{squirtle}, \text{squirtle})
\end{aligned}
$$`

---

## Unification

`$$
\begin{aligned}
\text{Let } x = \text{ charmander}\\
\text{isresistantto}(\text{charmander}, \text{charmander})\\
\text{isresistantto}(\text{squirtle}, \text{charmander})
\end{aligned}
$$`

---

## Unification

- Both scenarios cannot work because the constants `squirtle` and
  `charmander` *do not unify* with each other.

---

## Unification

1.  $a$ and $b$ are constants, and they are the same number or atom
2.  $a$ is a variable and $b$ is any type of term (in this case $a$ is
    instantiated to $b$) or $b$ is a variable and $a$ is any type of
    term (in this case $b$ is instantiated to $a$). This rule
    automatically unifies any pair of variables

---

## Unification

3.  $a$ and $b$ are complex terms and:
    1.  They have the same functors and the same number of arguments
    2.  all their corresponding arguments unify
    3.  the variable instantiations are uniform or compatible (you
        cannot instantiate $x$ to some constant $a$ when unifying a pair
        and instantiate $x$ to another constant $b$ when unifying
        another pair of arguments)

---

## Unification

``` prolog
?- =(squirtle,squirtle)
true.
```

---

## Unification

``` prolog
?- =(squirtle,charmander)
no
```

---

## Unification

``` prolog
?- =(squirtle,X)
X=squirtle
true.
```

---

## Unification

``` prolog
?- =(X,Y)
X=_5071
Y=_5071
true.
```

---

## Unification

``` prolog
?- =(watertype(X),watertype(squirtle))
X=squirtle
true.
```

---

## Unification

``` prolog
?- =(f(g(X),X),f(Y,a))
X=a
Y=g(X)
true.
```

---

## Unification

- Unification with variables is an implementation of the inference rule
  **universal instantiation**.
- When you assume `p(X)` in the knowledge base, you assume that
  $\forall x p(x)$ which implies via *universal instantiation* that
  $p(a)$ is also true (for some constant $a$).

---

## Programming with unification

``` prolog
vertical(line(point(X,Y),point(X,Z))).
horizontal(line(point(X,Y),point(Z,Y))).
```

---

## Programming with unification

``` prolog
?- vertical(line(point(1,2),point(1,3)))
```

---

## Programming with unification

``` prolog
true.
```

---

## Programming with unification

``` prolog
?- horizontal(line(point(2,3),point(U,4)))
```

---

## Programming with unification

``` prolog
=(X,2)
=(Y,3)
=(U,Z)
=(Y,4)
```

---

## Programming with unification

``` prolog
false.
```

## Selective Linear Definite Resolution

- Prolog uses the algorithm called **Selective Linear Definite
  Resolution** (SLD Resolution) to answer queries efficiently.

---

## Selective Linear Definite Resolution

``` prolog
q(a).
s(b).
p(X).

?- p(a), p(b)
```

---

## Selective Linear Definite Resolution

- This creates *two separate sub goals* $\neg p(a)$ and $\neg p(b)$.
- One of the aspects of SLD resolution is how it only **selects one
  subgoal** out of the conjunction of goals.
- Prolog selects the **leftmost** subgoal first, in this case,
  $\neg p(a)$.

---

## Selective Linear Definite Resolution

- Prolog searches the entire knowledge base from **top to bottom**, and
  tries to unify the current subgoal with any fact or rule head in the
  knowledge base.
- A successful unification, *resolves the subgoal away* (i.e. the
  subgoal gets cancelled out via resolution).

---

## Selective Linear Definite Resolution

`$$
\begin{aligned}
p(X) \lor \bot\\
\neg p(a) \lor \bot\\
\hline
\bot \lor \bot
\end{aligned}
$$`

---

## Selective Linear Definite Resolution

``` prolog
f(a).
f(b).

g(a).
g(b).
```

---

## Selective Linear Definite Resolution

``` prolog

h(b).

k(X) :- f(X), g(X), h(X).
```

---

## Selective Linear Definite Resolution

``` prolog
?- k(Y).
```

---

## Selective Linear Definite Resolution

`$$
\begin{aligned}
\exists Y k(Y)
\end{aligned}
$$`

---

## Selective Linear Definite Resolution

| Current Goal          |
|:----------------------|
| $\forall Y \neg k(Y)$ |

---

## Selective Linear Definite Resolution

`$$
\begin{aligned}
\forall Y \neg Y k(Y) \land \\
\forall X (k(X) \lor \neg f(X) \lor \neg g(X) \lor \neg h(X))\\
\hline
\forall X (\neg f(X) \lor \neg g(X) \lor \neg h(X))
\end{aligned}
$$`

---

## Selective Linear Definite Resolution

`$$
\begin{aligned}
\forall Y \neg k(Y) \equiv \forall X \neg k(X) \\
\\
\forall X \neg k(X) \land \forall X (k(X) \lor \neg f(X) \lor \neg g(X) \lor \neg h(X))\\
\forall X (\neg k(X) \land (k(X) \lor \neg f(X) \lor \neg g(X) \lor \neg h(X))) \\
\forall X (\neg f(X) \lor \neg g(X) \lor \neg h(X))
\end{aligned}
$$`

---

## Selective Linear Definite Resolution

| Current Goal                                         |
|:-----------------------------------------------------|
| $\forall X (\neg f(X) \lor \neg g(X) \lor \neg h(X)$ |

---

## Selective Linear Definite Resolution

| Branch $X = a$ (current)             | Branch $X = b$                       |
|:-----------------------------------|:-----------------------------------|
| $\neg f(a) \lor \neg g(a) \lor h(a)$ | $\neg f(b) \lor \neg g(b) \lor h(b)$ |
| $\neg g(a) \lor \neg h(a)$           | $\neg g(b) \lor \neg h(b)$           |

---

## Selective Linear Definite Resolution

| Branch $X = a$ (current)             | Branch $X = b$                       |
|:-----------------------------------|:-----------------------------------|
| $\neg f(a) \lor \neg g(a) \lor h(a)$ | $\neg f(b) \lor \neg g(b) \lor h(b)$ |
| $\neg g(a) \lor \neg h(a)$           | $\neg g(b) \lor \neg h(b)$           |
| $\neg h(a)$                          | ...                                  |

---

## Selective Linear Definite Resolution

| Branch $X = a$                       | Branch $X = b$ (current)             |
|:-----------------------------------|:-----------------------------------|
| $\neg f(a) \lor \neg g(a) \lor h(a)$ | $\neg f(b) \lor \neg g(b) \lor h(b)$ |
| $\neg g(a) \lor \neg h(a)$           | $\neg g(b) \lor \neg h(b)$           |
| $\neg h(a)$                          | $\neg h(b)$                          |
| not refuted                          | $\bot$ (refuted)                     |

---

## Selective Linear Definite Resolution

``` prolog
Y = b,
true.
```

---

## Selective Linear Definite Resolution

1.  The first/leftmost subgoal is selected as the current goal.
2.  The knowledge base is searched for complements of the current goal.

---

## Selective Linear Definite Resolution

3.  For every complement in the knowledge perform the following:
    1.  Resolve away the complement and the current goal, while keeping
        the instantiations formed from the resolution.
    2.  Perform SLD resolution with the new goal as the resolvent.

---

## Selective Linear Definite Resolution

``` prolog
f(a).
g(b).
g(Z) :- f(Z).
h(X) :- g(X).

?- h(Y).
```

---

## Selective Linear Definite Resolution

`$$
\begin{aligned}
f(a) \land \\
g(b) \land \\
\forall Z (g(Z) \lor \neg f(Z)) \land \\
\forall X (h(X) \lor \neg g(X)) \land \\
\forall Y \neg h(Y)
\end{aligned}
$$`

---

## Selective Linear Definite Resolution

| Current Goal                                         |
|:-----------------------------------------------------|
| $\forall Y \neg h(Y)$                                |
| $\forall X \neg g(X)$ (with instantiation ($X = Y$)) |

---

## Selective Linear Definite Resolution

| Branch ($X=b$)   | Branch ($X=Z$) (Current Goal)                   |
|:-----------------|:------------------------------------------------|
| $\bot$ (refuted) | $\forall Z \neg f(Z)$                           |
| ...              | $\bot$ (refuted) (with instantiation ($X = a$)) |

---

## Selective Linear Definite Resolution

``` prolog
?- h(Y).
Y = b ;
Y = a.
```
