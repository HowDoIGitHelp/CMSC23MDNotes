## Factory Method Pattern

---

## Problem

![Factory Method](../mdNotes/copyright_free_drawings/factory_method.png)

---

## Solution

- You encapsulate the creation of a class inside a **factory method**
  that is specified to return an abstraction of the product.

---

## Solution

![factory method class
diagram](../mdNotes/uml/umlOutputs/factoryMethod.svg)

---

## Solution

> Somewhere inside factory you have one or more instances of creating or
> using the product.

## Why this is elegant

- **Single Responsibility Principle** - the extra level of encapsulation
  on the construction of the product (factory method), allows the
  factory to be responsible of creating the exact product type it needs.

---

## Why this is elegant

- **Open/Closed Principle** - instead of modifying the factory to
  incorporate the creation of different product realizations, you
  instead create an extension of the factory. No need for introspective
  checks since the factory method supports polymorphism of the product
  it creates.
- *Encapsulate what varies* - This pattern upholds one of OOP paradigms
  most important principles. Since the construction of product varies
  from product type to product type, it is encapsulated into the factory
  method.

---

## Why this is elegant

- This avoids tight **coupling** between the factory and the product

---

## Why this is elegant

> Coupled classes are classes which are very dependent on each other.
> Changing the code of one will most likely affect the other

---

## How to implement it:

1.  Create an abstraction for all product types (`Product`).
2.  Inside the base factory create the the factory method function
    `newProduct():Product`. Make sure it is specified to return
    abstraction `Product`.

---

## How to implement it:

3.  For every new product type that is added to the system, create 2 new
    classes: the new product type as a realization of `Product` and, and
    the factory for the new product type as a specialization of
    `Factory`.
4.  Inside each factory specialization override `newProduct()` to return
    the correct realization of `Product`.

---

## How to implement it:

5.  Replace every instance of constructor calls inside `Factory` with a
    call to the factory method `newProduct()`.

## Why this is elegant

- **Open/Closed Principle** - This solution is easier to maintain since
  you can add more variants of `Product` without touching any existing
  code. All you have to do is to add new realization for `Product` and a
  new realization `AbstractFactory`
- Changing the form and behavior of specific variants are isolated since
  its creation is abstracted.

---

## Why this is elegant

- You can easily switch between variants by swapping out the factory.

---

## How to implement it:

- For every product in the family of products, create an abstraction of
  it (`ProductA`, `ProductB`).
- For every variant of the products, create a factory,
  (`FactoryVariant1`, `FactoryVariant2`). These factories must realize
  under an abstraction `AbstractFactory`. The factory should contain
  abstract factory methods for each product,

---

## How to implement it:

- Inside every factory realization implement all factory methods.

## Why this is NOT elegant

- You can ensure single instance classes, just by being vigilant.
- Singletons require the use of static attributes and methods. Statics
  are anti-pattern because they are global variables and manipulators
  that can have invisible changes to state.
- Singletons are usually symptoms of bad design.
